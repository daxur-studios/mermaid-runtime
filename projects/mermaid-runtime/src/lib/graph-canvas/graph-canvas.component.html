<div class="graph-canvas__layout" [class.graph-canvas__layout--with-detail]="showDetail()">
  <div
    class="graph-canvas__viewport"
    #viewport
    [class.graph-canvas__viewport--background-none]="backgroundEffect() === 'none'"
    [class.graph-canvas__viewport--background-grid-dots]="backgroundEffect() === 'grid-dots'"
    [class.graph-canvas__viewport--background-grid]="backgroundEffect() === 'grid'"
    [class.graph-canvas__viewport--background-dots]="backgroundEffect() === 'dots'"
    [class.graph-canvas__viewport--background-custom]="backgroundEffect() === 'custom'"
    [style.--zoom-scale]="cameraState().scale"
    [style.--pan-x.px]="cameraState().x"
    [style.--pan-y.px]="cameraState().y"
    [style.--mr-pattern-fine-gap.px]="backgroundPatternLevels().fineGapPx"
    [style.--mr-pattern-fine-fade]="backgroundPatternLevels().fineFade"
    [style.--mr-pattern-coarse-gap.px]="backgroundPatternLevels().coarseGapPx"
    [style.--mr-pattern-coarse-fade]="backgroundPatternLevels().coarseFade"
  >
    <mr-graph-camera
      class="graph-canvas__camera"
      [controlsPlacement]="cameraControlsPlacement()"
      [direction]="direction()"
      (directionChange)="direction.set($event)"
      (userInteract)="onUserInteract()"
    >
      <div #mermaidHost class="graph-canvas__mermaid mermaid"></div>
    </mr-graph-camera>

    <mr-graph-banner class="graph-canvas__banner" [message]="bannerMessage()" (activated)="onBannerActivated($event)" />

    @if (runPill(); as pill) {
      <div class="graph-canvas__run-pill" [class.graph-canvas__run-pill--failed]="pill.state === 'failed'" data-run-pill>{{ pill.label }}</div>
    }

    @if (showBreadcrumb() && breadcrumbPlacement() === 'built-in' && breadcrumb().length > 0) {
      <mr-graph-breadcrumb
        class="graph-canvas__breadcrumb"
        [breadcrumbs]="breadcrumb()"
        (depthSelected)="goToDepth($event)"
      />
    }

    <!-- Host-supplied viewport overlays (extra controls, minimap, legends). -->
    <ng-content select="[overlay]"></ng-content>

    @if (showMinimap() && minimapPlacement() === 'built-in') {
      <div class="graph-canvas__minimap-shell">
        <mr-minimap
          class="graph-canvas__minimap"
          [contentRect]="minimapContentRect()"
          [viewportRect]="minimapViewportRect()"
          [nodes]="minimapNodes()"
          (jump)="centerOnPoint($event)"
        />
      </div>
    }
  </div>

  <!-- Host-supplied side detail (inspector/sidebar); reserved only when showDetail. -->
  <ng-content select="[detail]"></ng-content>
</div>
